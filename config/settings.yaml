# ==============================================================================
# BẢNG ĐIỀU KHIỂN VÀ QUY HOẠCH PIPELINE (MARKDOWN TO PDF ENGINE SCHEMA)
# Dự án: markdown_to_pdf_engine (Phiên bản v2.3.0 - Hybrid Math Engine Architecture)
# Kiến trúc: Separation of Concerns (SoC) - Single Source of Truth (SSOT) Configuration Layer
# ==============================================================================

# 1. CHUẨN MÃ HÓA TOÀN CỤC (GLOBAL ENCODING STANDARD)
# Cưỡng chế luồng Đọc (Read), Ghi (Write) và Render theo UTF-8
global_encoding_standard: "utf-8"

# 2. ĐIỀU HƯỚNG THƯ MỤC VÀ XỬ LÝ HÀNG LOẠT (DIRECTORY ROUTING & BATCH PROCESSING)
directory_routing:
  input_directory: "input"
  output_directory: "output"
  recursive_search: true
  allowed_extensions:
    - ".md"
    - ".markdown"
    - ".mdown"
  overwrite_existing: true
  auto_create_directories: true
  preserve_subfolder_structure: true

# 3. NHUỘM MÀU CÚ PHÁP MÃ NGUỒN (SYNTAX HIGHLIGHTING PROFILE)
syntax_highlighting_profile: "monokai"

# 4. GIỚI HẠN ĐỘ SÂU DẤU TRANG TIÊU ĐỀ (HEADING RETENTION & ANCHORS)
# Mở rộng max_bookmark_level lên cấp 6 để tiêm trọn vẹn Cây Mục lục (Outline)
heading_retention_depth:
  max_bookmark_level: 6
  enable_heading_anchors: true
  normalize_anchor_ascii: true

# 5. THÔNG SỐ TRANG IN VẬT LÝ (DOCUMENT LAYOUT CONFIGURATION)
# Cấu hình lề và khổ giấy chuẩn được nạp trực tiếp vào ExecutionContext DTO
document_layout:
  page_size: "A4"
  margin: "20mm"
  code_overflow_handling: "break-word"

# 6. CẤU HÌNH MỸ THUẬT CHỮ VÀ PHÔNG CHỮ HỆ THỐNG (TYPOGRAPHY CONFIGURATION)
typography_configuration:
  font_family: '"Segoe UI", "Arial", "Calibri", "Tahoma", sans-serif'
  code_font_family: '"Consolas", "Courier New", monospace'
  base_font_size: "11pt"
  line_height: "1.6"
  text_color: "#1a1a1a"

# 7. CẤU HÌNH ĐÁNH SỐ TIÊU ĐỀ TỰ ĐỘNG (HEADING NUMBERING CONFIGURATION)
heading_numbering_system:
  enable_auto_numbering: true
  h1_numbering_style: "roman"
  sub_heading_numbering_style: "decimal"
  number_separator: ". "

# 8. ĐIỀU HƯỚNG TRÌNH DUYỆT KHÔNG ĐẦU (HEADLESS BROWSER ENGINE)
# Quản lý vòng đời và tham số kết xuất trang in PDF của Playwright Chromium
headless_browser_engine:
  browser_type: "chromium"
  headless: true
  page_timeout_ms: 30000
  wait_until_event: "networkidle"
  print_background: true
  prefer_css_page_size: true

# 9. ĐIỀU HƯỚNG CÔNG TẮC ĐỘNG CƠ TOÁN HỌC (MATH ENGINE ROUTING v2.3.0)
# Chọn động cơ toán học active_engine:
#  - "katex_placeholder": Động cơ KaTeX + Thuật toán DOM Placeholder Injection (Tốc độ cao)
#  - "mathjax_svg": Động cơ MathJax v3 Vector SVG Offline (Độ sắc nét & Mỹ thuật hoàn hảo)
math_engine_routing:
  active_engine: "katex_placeholder"

# 10. BỘ KẾT XUẤT TOÁN HỌC KATEX OFFLINE (KATEX OFFLINE CONFIG v2.3.0)
katex_offline_config:
  enable_katex: true
  assets_dir: "assets/katex"
  css_filename: "katex.min.css"
  js_filename: "katex.min.js"
  auto_render_js_filename: "auto-render.min.js"
  strict_mode: false
  throw_on_error: false
  enable_base64_math_encoding: true
  enable_vietnamese_math_isolation: true
  vietnamese_font_family: '"Times New Roman", "Segoe UI", Arial, sans-serif'
  enable_base64_font_embedding: true
  hybrid_typography_fallback: '"Cambria Math", "Times New Roman", serif'
  delimiters:
    - left: "$$"
      right: "$$"
      display: true
    - left: "$"
      right: "$"
      display: false
    - left: "\\["
      right: "\\]"
      display: true
    - left: "\\("
      right: "\\)"
      display: false

# 11. BỘ KẾT XUẤT TOÁN HỌC MATHJAX V3 OFFLINE (MATHJAX V3 OFFLINE CONFIG v2.3.0)
mathjax_offline_config:
  enable_mathjax: true
  assets_dir: "assets/mathjax"
  js_filename: "tex-svg.js"
  font_cache: "global"
  scale: 1.0
  inline_math_delimiters:
    - ["$", "$"]
    - ["\\(", "\\)"]
  display_math_delimiters:
    - ["$$", "$$"]
    - ["\\[", "\\]"]

# 12. CẤU HÌNH ĐỘNG CƠ XỬ LÝ BẢNG BIỂU GFM (TABLE RENDERING SYSTEM)
table_rendering_system:
  enable_gfm_tables: true
  overflow_strategy: "clip_and_warn"
  repeat_header_on_page_break: true
  max_printable_width_mm: 170

# 13. MA TRẬN QUY CHUẨN IN ẤN HỌC THUẬT (ACADEMIC STANDARDS PROFILE)
academic_standards_profile:
  active_standard: "apa"
  prevent_orphans_and_widows: true
  code_block_page_break_inside: "avoid"
  table_page_break_inside: "avoid"

# 14. BỘ KẾT XUẤT LƯỢC ĐỒ (DIAGRAM ENGINES CONFIGURATION)
diagram_engine_config:
  enable_mermaid: true
  mermaid_assets_dir: "assets/mermaid"
  mermaid_js_filename: "mermaid.min.js"
  enable_d2: true
  d2_executable_path: "d2"
  enable_diagram_segmentation: true
